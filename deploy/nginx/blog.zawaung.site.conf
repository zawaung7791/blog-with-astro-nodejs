# Initial HTTP-only block; `certbot --nginx -d blog.zawaung.site` adds the
# HTTPS listener and the HTTP->HTTPS redirect. /api/ and /admin proxying
# is added in later stages.
server {
    listen 80;
    listen [::]:80;
    server_name blog.zawaung.site;

    root /home/zawaung/blog/dist/client;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
