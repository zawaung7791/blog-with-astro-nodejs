# nginx server block for blog.zawaung.site.
#
# First install: copy to /etc/nginx/sites-available/, symlink into
# sites-enabled, then run `sudo certbot --nginx -d blog.zawaung.site`. Certbot
# adds the HTTPS and redirect parts marked "managed by Certbot"; the
# `location` blocks are ours. The version below is that final result.
server {
    server_name blog.zawaung.site;

    root /home/zawaung/blog/dist/client;
    index index.html;

    # Static, prerendered site (including the Pagefind index).
    location / {
        try_files $uri $uri/ =404;
    }

    # Comments and contact form -> Node container, published on localhost only.
    location /api/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Moderation page. Both checks must pass (satisfy all): the client IP must be
    # in the allowlist AND the user must give valid basic-auth credentials.
    # The allowlist lives in its own file so it can be changed with
    # deploy/set-admin-ip.sh without touching this config.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        satisfy all;
        include snippets/blog-admin-allow.conf;
        auth_basic "Blog admin";
        auth_basic_user_file /etc/nginx/blog.htpasswd;

        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not pass the Authorization header on to the app.
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blog.zawaung.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blog.zawaung.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = blog.zawaung.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name blog.zawaung.site;
    return 404; # managed by Certbot
}
